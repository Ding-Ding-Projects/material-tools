name: Build and publish Windows release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      WIN_CSC_LINK: ""
      WIN_CSC_KEY_PASSWORD: ""
      CSC_LINK: ""
      CSC_KEY_PASSWORD: ""
    steps:
      - name: Record workflow start
        shell: pwsh
        run: |
          $started = (Get-Date).ToUniversalTime().ToString('o')
          "WORKFLOW_STARTED=$started" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out the release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js from the project contract
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Resolve release identity and public dim-sum code name
        id: identity
        shell: pwsh
        run: |
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $dish = node scripts/select-release-dish.mjs | ConvertFrom-Json
          "RELEASE_VERSION=$($package.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=build-$($package.version).${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_DISH_NAME=$($dish.name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_DISH_FILE=$($dish.filename)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_DISH_URL=$($dish.assetUrl)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VITE_RELEASE_CODENAME=$($dish.name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore build dependencies
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Build the real unsigned Squirrel.Windows installer
        id: package
        shell: pwsh
        run: |
          & .\build-installer.bat /s *>&1 | Tee-Object -FilePath build-output.log
          $exitCode = $LASTEXITCODE
          "EXIT=$exitCode" | Out-File -FilePath build-output.log -Encoding utf8 -Append
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Count release lines from the committed script
        shell: pwsh
        run: node scripts/count-lines.mjs | Out-File -FilePath line-count.md -Encoding utf8

      - name: Collect safe build evidence
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          if (Test-Path build-output.log) { Copy-Item build-output.log evidence/build-output.log }
          if (Test-Path line-count.md) { Copy-Item line-count.md evidence/line-count.md }
          if (Test-Path dist\squirrel-windows) { Copy-Item dist\squirrel-windows evidence\squirrel-windows -Recurse }
          @{
            runId = '${{ github.run_id }}'
            commit = '${{ github.sha }}'
            job = '${{ job.status }}'
            runner = '${{ runner.name }}'
            os = '${{ runner.os }}'
            architecture = '${{ runner.arch }}'
          } | ConvertTo-Json | Out-File evidence/context.json -Encoding utf8

      - name: Upload safe build evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-evidence-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Publish and verify one unique release
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\squirrel-windows -Filter '*Setup*.exe' -File | Select-Object -First 1
          $package = Get-ChildItem dist\squirrel-windows -Filter '*-full.nupkg' -File | Select-Object -First 1
          $releaseIndex = Get-Item dist\squirrel-windows\RELEASES
          if (-not $setup -or -not $package -or -not $releaseIndex) { throw 'Required Squirrel.Windows assets are missing.' }
          $setupHash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash
          $packageHash = (Get-FileHash -Algorithm SHA256 $package.FullName).Hash
          $lineCount = Get-Content -Raw line-count.md

          gh release create $env:RELEASE_TAG $setup.FullName $package.FullName $releaseIndex.FullName --target $env:GITHUB_SHA --title "Material Tools $env:RELEASE_VERSION · $env:RELEASE_DISH_NAME" --notes 'Release evidence is being finalized by this workflow.'
          $release = gh release view $env:RELEASE_TAG --json tagName,targetCommitish,isDraft,isPrerelease,publishedAt,assets,url | ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease) { throw 'Release was not published as a final non-draft release.' }
          if ($release.targetCommitish -ne $env:GITHUB_SHA) { throw 'Release target does not match the workflow commit.' }
          if ($release.assets.Count -ne 3) { throw "Expected 3 release assets, found $($release.assets.Count)." }
          New-Item -ItemType Directory -Force release-download | Out-Null
          gh release download $env:RELEASE_TAG --pattern $setup.Name --dir release-download
          $downloadHash = (Get-FileHash -Algorithm SHA256 (Join-Path release-download $setup.Name)).Hash
          if ($downloadHash -ne $setupHash) { throw 'Downloaded installer hash does not match the built installer.' }

          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | ConvertFrom-Json
          $startedAt = [DateTimeOffset]::Parse($run.run_started_at).UtcDateTime
          $publishedAt = [DateTimeOffset]::Parse($release.publishedAt).UtcDateTime
          $duration = $publishedAt - $startedAt
          $durationText = '{0:00}:{1:00}:{2:00}' -f [math]::Floor($duration.TotalHours), $duration.Minutes, $duration.Seconds
          $startedText = $startedAt.ToString('yyyy-MM-ddTHH:mm:ssZ')
          $completedText = $publishedAt.ToString('yyyy-MM-ddTHH:mm:ssZ')
          $template = @'
          # Material Tools __VERSION__

          **Commit:** `__COMMIT__`

          **Dim-sum code name:** [__DISH_NAME__](__DISH_URL__)

          **Public photo asset:** `__DISH_FILE__`

          > [!WARNING]
          > The Windows installer and update packages are intentionally unsigned. Windows may show an unknown-publisher or SmartScreen warning. Verify the SHA-256 digest below before running the installer.

          ## Assets

          | Asset | SHA-256 |
          |---|---|
          | `__SETUP_NAME__` | `__SETUP_HASH__` |
          | `__PACKAGE_NAME__` | `__PACKAGE_HASH__` |
          | `RELEASES` | Squirrel.Windows update index |

          ## Verification

          - Local checks recorded before the push: TypeScript, 4 unit tests, production build, root build script, Squirrel.Windows packaging, required-asset presence, and `NotSigned` verification.
          - GitHub Actions intentionally ran no tests, lint, type checks, static analysis, accessibility checks, or screenshot gates. A release can therefore publish even if a later local check would fail; this is the repository's accepted delivery policy.
          - Build and packaging completed on __RUNNER_NAME__ (`__RUNNER_OS__` / `__RUNNER_ARCH__`).
          - The published installer was downloaded again and its SHA-256 matched the built installer.

          ## Workflow timing

          - Workflow started: `__STARTED__`
          - Workflow completed: `__COMPLETED__`
          - Workflow duration: `__DURATION__`

          ## Line count

          Reproduce with `node scripts/count-lines.mjs` at `__COMMIT__`.

          __LINE_COUNT__
          '@
          $notes = $template.Replace('__VERSION__', $env:RELEASE_VERSION)
          $notes = $notes.Replace('__COMMIT__', $env:GITHUB_SHA)
          $notes = $notes.Replace('__DISH_NAME__', $env:RELEASE_DISH_NAME)
          $notes = $notes.Replace('__DISH_URL__', $env:RELEASE_DISH_URL)
          $notes = $notes.Replace('__DISH_FILE__', $env:RELEASE_DISH_FILE)
          $notes = $notes.Replace('__SETUP_NAME__', $setup.Name)
          $notes = $notes.Replace('__SETUP_HASH__', $setupHash)
          $notes = $notes.Replace('__PACKAGE_NAME__', $package.Name)
          $notes = $notes.Replace('__PACKAGE_HASH__', $packageHash)
          $notes = $notes.Replace('__RUNNER_NAME__', $env:RUNNER_NAME)
          $notes = $notes.Replace('__RUNNER_OS__', $env:RUNNER_OS)
          $notes = $notes.Replace('__RUNNER_ARCH__', $env:RUNNER_ARCH)
          $notes = $notes.Replace('__STARTED__', $startedText)
          $notes = $notes.Replace('__COMPLETED__', $completedText)
          $notes = $notes.Replace('__DURATION__', $durationText)
          $notes = $notes.Replace('__LINE_COUNT__', $lineCount.TrimEnd())
          [System.IO.File]::WriteAllText((Join-Path $PWD 'release-notes.md'), $notes, [System.Text.UTF8Encoding]::new($false))
          gh release edit $env:RELEASE_TAG --notes-file release-notes.md

          $published = gh release view $env:RELEASE_TAG --json body | ConvertFrom-Json
          $unresolved = @('__VERSION__', '__COMMIT__', '__DISH_NAME__', '__DISH_URL__', '__DISH_FILE__', '__SETUP_NAME__', '__SETUP_HASH__', '__PACKAGE_NAME__', '__PACKAGE_HASH__', '__RUNNER_NAME__', '__RUNNER_OS__', '__RUNNER_ARCH__', '__STARTED__', '__COMPLETED__', '__DURATION__', '__LINE_COUNT__', '$env:', '$setupHash', '$packageHash')
          foreach ($marker in $unresolved) {
            if ($published.body.Contains($marker)) { throw "Release notes contain unresolved marker: $marker" }
          }
          foreach ($value in @($setup.Name, $package.Name, $setupHash, $packageHash, $startedText, $completedText, $durationText, $env:RELEASE_DISH_FILE)) {
            if (-not $published.body.Contains($value)) { throw "Release notes are missing evidence: $value" }
          }
